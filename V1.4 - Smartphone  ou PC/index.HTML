<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paul's SPACE Shooter - Édition Ultime</title>
    <!-- Le paramètre ?v=3.0 force le navigateur (surtout mobile) à vider son cache CSS -->
    <link rel="stylesheet" href="style.css?v=3.0">
</head>
<body>

    <!-- ZONE DE JEU PRINCIPALE -->
    <div id="game-container">
        
        <!-- Le HUD (Barre de score et d'informations flottante) -->
        <div id="hud">
            <div class="hud-item">SCORE: <span id="score">0</span></div>
            <div class="hud-item">NIVEAU: <span id="level">1</span></div>
            <div class="hud-item">MULTIPLIER: <span id="combo-multiplier" style="color: #22d3ee;">x1</span></div>
            <div class="hud-item">MEILLEUR: <span id="high-score">0</span></div>
            <span id="streak" style="display:none;">0/5</span>
        </div>

        <!-- Écran d'accueil et de Game Over -->
        <div id="game-over-screen">
            <h1 id="screen-title">PAUL TYPING SHOOTER</h1>
            <p id="screen-stats">Choisissez votre appareil pour lancer la défense spatiale !</p>
            
            <!-- Menu de sélection d'appareil -->
            <div id="device-selection" style="display: flex; gap: 15px; margin-bottom: 20px;">
                <button id="btn-pc" class="menu-btn">💻 JOUER SUR PC</button>
                <button id="btn-mobile" class="menu-btn">📱 JOUER SUR MOBILE</button>
            </div>
            
            <button id="restart-btn" style="display: none;">RECOMMENCER</button>
            <p id="game-credits">Créé par <span>Julien.L</span></p>
        </div>

        <!-- ZONE DE TEXTE INVISIBLE MAIS SÉCURISÉE CONTRE LE ZOOM MOBILE -->
        <input type="text" id="mobile-input" autocomplete="off" autocapitalize="characters" style="position: absolute; opacity: 0; bottom: 0; left: 0; width: 1px; height: 1px; z-index: -1; border: none; background: transparent; font-size: 16px;">

        <!-- BOUTON DE SÉCURITÉ POUR ROUVRIR LE CLAVIER COMPATIBLE MOBILE -->
        <button id="keyboard-trigger" style="display: none; position: absolute; top: 110px; right: 20px; z-index: 150; background: #eab308; color: #000; font-weight: bold; border: none; padding: 8px 14px; border-radius: 4px; font-size: 12px; cursor: pointer; box-shadow: 0 0 10px rgba(234, 179, 8, 0.4);">⌨️ CLAVIER</button>

        <!-- LE VAISSEAU VECTORIEL SVG DU JOUEUR -->
        <div id="player-ship">
            <svg viewBox="0 0 60 60" width="100%" height="100%">
                <!-- Réacteurs arrière avec lueur rouge -->
                <path d="M 22 52 L 22 58 L 26 58 L 26 52 Z M 34 52 L 34 58 L 38 58 L 38 52 Z" fill="#ef4444" filter="drop-shadow(0 0 4px #ef4444)"/>
                <!-- Corps principal aérodynamique -->
                <path d="M 30 2 L 40 45 L 35 52 L 25 52 L 20 45 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
                <!-- Aile Gauche -->
                <path d="M 22 35 L 5 48 L 18 48 L 22 42 Z" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
                <!-- Aile Droite -->
                <path d="M 38 35 L 55 48 L 42 48 L 38 42 Z" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
                <!-- Canons Laser latéraux -->
                <path d="M 7 42 L 7 35 M 53 42 L 53 35" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
                <!-- Cockpit central rétro-éclairé -->
                <ellipse cx="30" cy="28" rx="4" ry="10" fill="#22d3ee" filter="drop-shadow(0 0 5px #22d3ee)"/>
            </svg>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
